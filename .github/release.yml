changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot]
  categories:
    - title: 新機能
      labels: [feature, enhancement]
    - title: 不具合の修正
      labels: [bug, fix]
    - title: セキュリティ
      labels: [security]
    - title: ドキュメント
      labels: [documentation]
    - title: 依存関係
      labels: [dependencies]
    - title: その他
      labels: ['*']
