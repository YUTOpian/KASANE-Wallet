    <!--
      この <meta> の Content-Security-Policy は、開発サーバー（npm run dev）で使うゆるい設定。
      HMR / 開発用の仕組みがインラインのコードと eval を使うため、script-src に 'unsafe-inline' と
      'unsafe-eval' を入れている。

      本番ビルド（npm run build）では、この <meta> は使われない。vite.config.ts の kasane-csp-hash
      プラグインが、できあがった dist/index.html の CSP を、vite-csp.ts が作るものに差し替える:
        - インラインの script は 'unsafe-inline' ではなく、各 script の sha256 ハッシュで許可する
          （ハッシュに合わない script は、XSS で差し込まれたものも拡張機能が足したものも動かない）
        - 'unsafe-eval' は付けない。WebAssembly のコンパイルだけ 'wasm-unsafe-eval' で許可する
        - object-src 'none' / base-uri 'none' / form-action 'none'
        - connect-src は https / http / wss / ws。送金先ノードの URL を利用者が自由に指定できる
          仕様のため、通信先のドメインは絞れない
        - style-src の 'unsafe-inline' は残す（MUI / emotion がインラインの style を差し込む）
        - worker-src は blob: だけ（コンソールの Worker は単一HTMLに Blob として埋め込む）。
          開発サーバーのこの <meta> は、開発中の Worker の読み込みのために 'self' も許している

      frame-ancestors は <meta> の CSP では効かない（仕様で、HTTP ヘッダーの CSP でしか効かない）ので
      書かない。他のページの <iframe> に埋め込まれての操作（クリックジャッキング）は、
      src/lib/frameGuard.ts が main.tsx の最初の import として検出して止める。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https: http: wss: ws:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none';" />
